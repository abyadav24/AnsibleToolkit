---
# Comprehensive SMC Server Firmware Update Playbook
# Updates BMC, BIOS, and SMC NIC firmware for Supermicro servers
- name: DS Server Firmware Update - BMC, BIOS & NIC
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../config/version_config.yaml
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  environment:
    ANSIBLE_LIBRARY: "{{ playbook_dir }}/../plugins/modules"
  
  tasks:
    - name: Display VirtualBox mounting instructions
      debug:
        msg: |
          ##########
          AnsibleMediakit folder must be mounted on the virtual box Guest vm.
          Manually mount the folder in the setting->shared folder on virtual box.
          #################
          
    - name: Check if AnsibleMediakit is already mounted
      stat:
        path: /mnt/AnsibleMediakit
      register: mount_check
      
    - name: Create mount directory for AnsibleMediakit
      file:
        path: /mnt/AnsibleMediakit
        state: directory
        mode: '0755'
      become: yes
      when: not mount_check.stat.exists
      ignore_errors: yes
      
    - name: Check if AnsibleMediakit shared folder is already mounted
      shell: mount | grep -q "AnsibleMediakit.*vboxsf" && echo "mounted" || echo "not_mounted"
      register: vbox_mount_status
      changed_when: false
      ignore_errors: yes
      
    - name: Check if AnsibleMediakit has content (DS folder exists)
      stat:
        path: /mnt/AnsibleMediakit/DS
      register: ds_folder_check
      
    - name: Mount VirtualBox shared folder if not mounted
      shell: mount -t vboxsf AnsibleMediakit /mnt/AnsibleMediakit
      become: yes
      when: >
        (vbox_mount_status.stdout | default('not_mounted') == 'not_mounted') or 
        (not ds_folder_check.stat.exists | default(true))
      register: vbox_mount_result
      ignore_errors: yes
      
    - name: Verify VirtualBox shared folder mount
      stat:
        path: /mnt/AnsibleMediakit/DS
      register: mount_verify
      
    - name: Fail if shared folder mount failed
      fail:
        msg: |
          ERROR: Failed to mount VirtualBox shared folder 'AnsibleMediakit'.
          Please ensure:
          1. VirtualBox Guest Additions are installed
          2. Shared folder 'AnsibleMediakit' is configured in VM settings
          3. Run: sudo mount -t vboxsf AnsibleMediakit /mnt/AnsibleMediakit
      when: not mount_verify.stat.exists
      
    - name: Display mount status
      debug:
        msg: "AnsibleMediakit shared folder mounted successfully - DS folder accessible: {{ mount_verify.stat.exists }}"
      
    - name: List contents of AnsibleMediakit folder
      shell: ls -la /mnt/AnsibleMediakit 2>/dev/null || echo "Directory not accessible"
      register: mount_contents
      ignore_errors: yes
      
    - name: Display AnsibleMediakit folder contents
      debug:
        msg: "AnsibleMediakit contents: {{ mount_contents.stdout_lines | default(['Not accessible']) }}"
      
    - name: Load toolkit configuration
      include_vars:
        file: ../config/toolkit_config.json
        name: toolkit_config
        
    - name: Check firmware skip settings from toolkit config
      set_fact:
        skip_bmc: "{{ toolkit_config.firmware_skip_bmc | default('false') | bool }}"
        skip_bios: "{{ toolkit_config.firmware_skip_bios | default('false') | bool }}"
        skip_pcie: "{{ toolkit_config.firmware_skip_pcie_devices | default('false') | bool }}"
        enable_phase1: true  # Always enable Phase 1 FRU updates
        
    - name: Display firmware update configuration
      debug:
        msg: |
          Firmware Configuration Loaded:
          - Phase 1 (FRU Updates): {{ 'ENABLED' if enable_phase1 else 'DISABLED' }}
          - BMC Update: {{ 'SKIPPED (disabled in toolkit_config)' if skip_bmc else 'ENABLED' }}
          - BIOS Update: {{ 'SKIPPED (disabled in toolkit_config)' if skip_bios else 'ENABLED' }}
          - PCIe Devices Update: {{ 'SKIPPED (disabled in toolkit_config)' if skip_pcie else 'ENABLED' }}
        
    - name: Generate timestamped log file paths
      set_fact:
        timestamp: "{{ ansible_date_time.epoch }}"
        log_timestamp: "{{ ansible_date_time.year }}{{ ansible_date_time.month }}{{ ansible_date_time.day }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}"
        firmware_log_file: "{{ playbook_dir }}/../logs/firmware_update_{{ ansible_date_time.year }}{{ ansible_date_time.month }}{{ ansible_date_time.day }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}.log"
        saa_module_log_file: "{{ playbook_dir }}/../logs/Firmware_AnsibleModule_{{ ansible_date_time.year }}{{ ansible_date_time.month }}{{ ansible_date_time.day }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}.log"
        
    - name: Create logs directory if it doesn't exist
      file:
        path: "{{ playbook_dir }}/../logs"
        state: directory
        mode: '0755'
        
    - name: Initialize timestamped log files
      shell: |
        echo "=== SMC Firmware Update Started: $(date) ===" > {{ firmware_log_file }}
        echo "Log Timestamp: {{ log_timestamp }}" >> {{ firmware_log_file }}
        echo "Processing servers from server.csv" >> {{ firmware_log_file }}
        echo "Skip Settings - BMC: {{ skip_bmc }}, BIOS: {{ skip_bios }}, PCIe: {{ skip_pcie }}" >> {{ firmware_log_file }}
        echo "Phase 1 (FRU): {{ 'ENABLED' if enable_phase1 else 'DISABLED' }}" >> {{ firmware_log_file }}
        echo "=== Firmware Ansible Module Operations Log ===" > {{ saa_module_log_file }}
        echo "Started: $(date)" >> {{ saa_module_log_file }}

    - name: Ensure mounted firmware directory exists
      file:
        path: /tmp/firmware_mount/SMCI
        state: directory
        mode: '0755'

    - name: Create firmware subdirectories if not present
      file:
        path: "/tmp/firmware_mount/SMCI/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - Firmware/BMC
        - Firmware/BIOS
        - Firmware/OEMNic
        - Firmware/SMCNic

    - name: Ensure temp directory exists
      file:
        path: "{{ settings.temp_path }}"
        state: directory
        mode: '0755'

    - name: Read server details from CSV file
      read_csv:
        path: "../config/server.csv"
      register: server_list

    - name: Display servers to be processed
      debug:
        msg: "Processing {{ server_list.list | length }} servers"

    # Phase One: Update SMBIOS/FRU Info fields for rebranding
    - name: "Phase 1: Update FRU Info for each DS Server"
      include_tasks: ../plugins/module_utils/smci_firmware_tasks_copy.yml
      loop: "{{ server_list.list }}"
      vars:
        firmware_skip_bmc: "{{ skip_bmc }}"
        firmware_skip_bios: "{{ skip_bios }}"
        firmware_skip_pcie_devices: "{{ skip_pcie }}"
        phase: "fru_update"
      when: 
        - item.Type == 'DS_Server'
        - enable_phase1 | default(true)
      loop_control:
        loop_var: item
        extended: true

    - name: Display completion summary
      debug:
        msg: "SMC Firmware update process completed for all servers."

    - name: "Display log file locations for reference"
      debug:
        msg: |
          LOG FILES GENERATED:
          ========================================
          Main Log File: {{ firmware_log_file }}
          Detailed SAA Module Log: {{ saa_module_log_file }}
          
          TO VIEW LOGS:
          cat {{ firmware_log_file }}
          cat {{ saa_module_log_file }}
          
          Log Summary:
          - Timestamp: {{ log_timestamp }}
          - Servers Processed: {{ server_list.list | length }}
          - Location: {{ playbook_dir }}/logs/
          ========================================