---
# Enhanced process single server for detailed network discovery

- name: "Log start of enhanced server discovery for {{ server_data.hostname }}"
  shell: |
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Starting ENHANCED discovery for server {{ server_data.hostname }}" >> {{ configchecker_log_file }}
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] [NetworkDiscovery] Server IP: {{ server_data.ipv4 }}" >> {{ configchecker_log_file }}
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Starting ENHANCED discovery for server {{ server_data.hostname }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] [NetworkDiscovery] Server IP: {{ server_data.ipv4 }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}

- name: "Test basic connectivity to {{ server_data.hostname }}"
  uri:
    url: "https://{{ server_data.ipv4 }}/redfish/v1"
    method: GET
    user: "{{ server_data.username }}"
    password: "{{ server_data.password }}"
    force_basic_auth: yes
    validate_certs: no
    timeout: 10
    headers:
      Accept: "application/json"
    status_code: [200, 401, 404, 500, 503]
  register: connectivity_test
  ignore_errors: true

- name: "Log connectivity test result for {{ server_data.hostname }}"
  shell: |
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] [NetworkDiscovery] Connectivity test for {{ server_data.hostname }}: {{ 'SUCCESS' if connectivity_test.status == 200 else 'FAILED' }}" >> {{ configchecker_log_file }}
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] [NetworkDiscovery] Connectivity status code: {{ connectivity_test.status | default('N/A') }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}

- name: "Get network adapters collection for {{ server_data.hostname }}"
  uri:
    url: "https://{{ server_data.ipv4 }}/redfish/v1/Chassis/1/NetworkAdapters"
    method: GET
    user: "{{ server_data.username }}"
    password: "{{ server_data.password }}"
    force_basic_auth: yes
    validate_certs: no
    timeout: 30
    headers:
      Accept: "application/json"
    status_code: [200, 401, 404, 500, 503]
  register: adapters_result
  ignore_errors: true

- name: "Process each network adapter with detailed information"
  when: adapters_result.status == 200 and adapters_result.json.Members is defined
  block:
    - name: "Log start of detailed processing for {{ server_data.hostname }}"
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Processing {{ adapters_result.json.Members | length }} adapters with detailed information" >> {{ configchecker_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Starting detailed adapter information gathering" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}

    - name: "Get detailed information for each adapter"
      uri:
        url: "https://{{ server_data.ipv4 }}{{ item['@odata.id'] }}"
        method: GET
        user: "{{ server_data.username }}"
        password: "{{ server_data.password }}"
        force_basic_auth: yes
        validate_certs: no
        timeout: 30
        headers:
          Accept: "application/json"
        status_code: [200, 401, 404, 500, 503]
      register: adapter_details
      ignore_errors: true
      loop: "{{ adapters_result.json.Members }}"
      loop_control:
        index_var: adapter_index

    - name: "Get port information for each adapter"
      uri:
        url: "https://{{ server_data.ipv4 }}{{ item.json.Ports['@odata.id'] if item.json is defined and item.json.Ports is defined else '/invalid' }}"
        method: GET
        user: "{{ server_data.username }}"
        password: "{{ server_data.password }}"
        force_basic_auth: yes
        validate_certs: no
        timeout: 30
        headers:
          Accept: "application/json"
        status_code: [200, 401, 404, 500, 503]
      register: ports_collections
      ignore_errors: true
      loop: "{{ adapter_details.results }}"
      when: item.json is defined and item.json.Ports is defined

    - name: "Get individual port details for MAC addresses"
      uri:
        url: "https://{{ server_data.ipv4 }}{{ item.1['@odata.id'] }}"
        method: GET
        user: "{{ server_data.username }}"
        password: "{{ server_data.password }}"
        force_basic_auth: yes
        validate_certs: no
        timeout: 30
        headers:
          Accept: "application/json"
        status_code: [200, 401, 404, 500, 503]
      register: port_details
      ignore_errors: true
      loop: "{{ ports_collections.results | selectattr('json', 'defined') | selectattr('json.Members', 'defined') | subelements('json.Members') }}"
      when: ports_collections is defined

    - name: "Add detailed network adapter entries to table and CSV"
      shell: |
        {% set adapter = adapter_details.results[loop.index0] %}
        {% if adapter.json is defined %}
        {% set manufacturer = adapter.json.Manufacturer | default('Unknown') %}
        {% set model = adapter.json.Model | default('Unknown') %}
        {% set part_number = adapter.json.PartNumber | default('Unknown') %}
        {% set serial_number = adapter.json.SerialNumber | default('Unknown') %}
        {% set firmware = adapter.json.Controllers[0].FirmwarePackageVersion | default('Unknown') if adapter.json.Controllers is defined and adapter.json.Controllers | length > 0 else 'Unknown' %}
        {% set port_count = adapter.json.Controllers[0].ControllerCapabilities.NetworkPortCount | default('Unknown') if adapter.json.Controllers is defined and adapter.json.Controllers | length > 0 and adapter.json.Controllers[0].ControllerCapabilities is defined else 'Unknown' %}
        
        # Find MAC addresses for this adapter from port details
        {% set mac_addresses = [] %}
        {% for port_result in port_details.results %}
        {% if port_result.json is defined and port_result.json.Ethernet is defined and port_result.json.Ethernet.AssociatedMACAddresses is defined %}
        {% for mac in port_result.json.Ethernet.AssociatedMACAddresses %}
        {% set _ = mac_addresses.append(mac) %}
        {% endfor %}
        {% endif %}
        {% endfor %}
        {% set mac_address_str = mac_addresses | join(', ') if mac_addresses | length > 0 else 'Unknown' %}
        
        # Add detailed entry to table
        printf "║ %-12s │ %-15s │ %-12s │ %-20s │ %-12s │ %-18s │ %-12s │ %-18s │ %-12s │ %-6s │ %-17s ║\n" \
          "{{ server_data.hostname[:12] }}" \
          "{{ server_data.ipv4[:15] }}" \
          "{{ server_data.vendor[:12] }}" \
          "{{ (adapter.json.Name | default('Adapter ' + (loop.index | string)))[:20] }}" \
          "{{ manufacturer[:12] }}" \
          "{{ model[:18] }}" \
          "{{ part_number[:12] }}" \
          "{{ serial_number[:18] }}" \
          "{{ firmware[:12] }}" \
          "{{ port_count | string }}" \
          "{{ mac_address_str[:17] }}" \
          >> {{ current_discovery_table_file | default(discovery_table_file) }}
        
        # Add detailed entry to CSV
        echo "{{ server_data.hostname }},{{ server_data.ipv4 }},{{ server_data.vendor }},{{ adapter.json.Name | default('Adapter ' + (loop.index | string)) }},{{ manufacturer }},{{ model }},{{ part_number }},{{ serial_number }},{{ firmware }},{{ port_count }},{{ mac_address_str }},DETAILED_SUCCESS" >> {{ current_discovery_csv_file | default(discovery_csv_file) }}
        
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Added detailed info for {{ adapter.json.Name | default('Adapter ' + (loop.index | string)) }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}
        {% else %}
        # Add failed entry for this adapter
        printf "║ %-12s │ %-15s │ %-12s │ %-20s │ %-12s │ %-18s │ %-12s │ %-18s │ %-12s │ %-6s │ %-17s ║\n" \
          "{{ server_data.hostname[:12] }}" \
          "{{ server_data.ipv4[:15] }}" \
          "{{ server_data.vendor[:12] }}" \
          "Adapter {{ loop.index }}" \
          "DETAIL FAILED" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          >> {{ current_discovery_table_file | default(discovery_table_file) }}
        
        echo "{{ server_data.hostname }},{{ server_data.ipv4 }},{{ server_data.vendor }},Adapter {{ loop.index }},DETAIL FAILED,N/A,N/A,N/A,N/A,N/A,N/A,DETAIL_FAILED" >> {{ current_discovery_csv_file | default(discovery_csv_file) }}
        {% endif %}
      loop: "{{ adapters_result.json.Members }}"

    - name: "Log successful enhanced discovery completion for {{ server_data.hostname }}"
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Enhanced discovery completed successfully for {{ server_data.hostname }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Added {{ adapters_result.json.Members | length }} detailed adapter entries to output files" >> {{ configchecker_log_file }}

# FAILURE CASE - Handle failed discovery
- name: "Handle failed discovery for {{ server_data.hostname }}"
  when: adapters_result.status != 200 or adapters_result.json.Members is not defined
  block:
    - name: "Add failed discovery entry to table"
      shell: |
        printf "║ %-12s │ %-15s │ %-12s │ %-20s │ %-12s │ %-18s │ %-12s │ %-18s │ %-12s │ %-6s │ %-17s ║\n" \
          "{{ server_data.hostname[:12] }}" \
          "{{ server_data.ipv4[:15] }}" \
          "{{ server_data.vendor[:12] }}" \
          "DISCOVERY FAILED" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          >> {{ current_discovery_table_file | default(discovery_table_file) }}

    - name: "Add failed discovery entry to CSV"
      shell: |
        echo "{{ server_data.hostname }},{{ server_data.ipv4 }},{{ server_data.vendor }},DISCOVERY FAILED,N/A,N/A,N/A,N/A,N/A,N/A,N/A,FAILED" >> {{ current_discovery_csv_file | default(discovery_csv_file) }}

    - name: "Log failed discovery for {{ server_data.hostname }}"
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] [NetworkDiscovery] Discovery FAILED for {{ server_data.hostname }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] [NetworkDiscovery] Error details: {{ adapters_result.msg | default(adapters_result.content | default('Unknown error')) }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] [NetworkDiscovery] Discovery FAILED for {{ server_data.hostname }}" >> {{ configchecker_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] [NetworkDiscovery] Reason: {{ adapters_result.msg | default(adapters_result.content | default('Unknown error')) }}" >> {{ configchecker_log_file }}