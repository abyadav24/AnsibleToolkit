          "{{ link_status[:13] }}" \
          >> {{ current_discovery_table_file | default(discovery_table_file) }}
        
        echo "{{ server_data.hostname }},{{ server_data.ipv4 }},{{ server_data.vendor }},{{ adapter5_details.json.Name | default('Intel Ethernet') }},{{ manufacturer }},{{ model }},{{ part_number }},{{ serial_number }},{{ firmware }},{{ port_count }},{{ mac_address }},{{ link_status }},DETAILED_SUCCESS" >> {{ current_discovery_csv_file | default(discovery_csv_file) }}
        {% else %}
        printf "║ %-12s │ %-15s │ %-12s │ %-20s │ %-12s │ %-18s │ %-12s │ %-18s │ %-12s │ %-6s │ %-17s │ %-13s ║\n" \
          "{{ server_data.hostname[:12] }}" \
          "{{ server_data.ipv4[:15] }}" \
          "{{ server_data.vendor[:12] }}" \
          "Intel Ethernet" \
          "DETAIL FAILED" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          >> {{ current_discovery_table_file | default(discovery_table_file) }}

        echo "{{ server_data.hostname }},{{ server_data.ipv4 }},{{ server_data.vendor }},Intel Ethernet,DETAIL FAILED,N/A,N/A,N/A,N/A,N/A,N/A,N/A,DETAIL_FAILED" >> {{ current_discovery_csv_file | default(discovery_csv_file) }}
        {% endif %}

    - name: "Log successful enhanced discovery completion for {{ server_data.hostname }}"
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Enhanced discovery completed successfully for {{ server_data.hostname }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Added {{ adapters_result.json.Members | length }} detailed adapter entries to output files" >> {{ configchecker_log_file }}

# FAILURE CASE - Handle failed discovery
- name: "Handle failed discovery for {{ server_data.hostname }}"
  when: adapters_result.status != 200 or adapters_result.json.Members is not defined
  block:
    - name: "Add failed discovery entry to table"
      shell: |
        printf "║ %-12s │ %-15s │ %-12s │ %-20s │ %-12s │ %-18s │ %-12s │ %-18s │ %-12s │ %-6s │ %-17s │ %-13s ║\n" \
          "{{ server_data.hostname[:12] }}" \
          "{{ server_data.ipv4[:15] }}" \
          "{{ server_data.vendor[:12] }}" \
          "DISCOVERY FAILED" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          >> {{ current_discovery_table_file | default(discovery_table_file) }}

        echo "{{ server_data.hostname }},{{ server_data.ipv4 }},{{ server_data.vendor }},DISCOVERY FAILED,N/A,N/A,N/A,N/A,N/A,N/A,N/A,N/A,DISCOVERY_FAILED" >> {{ current_discovery_csv_file | default(discovery_csv_file) }}

    - name: "Log failed discovery for {{ server_data.hostname }}"
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] [NetworkDiscovery] Discovery FAILED for {{ server_data.hostname }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] [NetworkDiscovery] Error details: {{ adapters_result.msg | default(adapters_result.content | default('Unknown error')) }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}