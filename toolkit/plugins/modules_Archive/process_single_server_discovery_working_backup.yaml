---
# Enhanced process single server for detailed network discovery - WORKING VERSION

- name: "Log start of enhanced server discovery for {{ server_data.hostname }}"
  shell: |
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Starting ENHANCED discovery for server {{ server_data.hostname }}" >> {{ configchecker_log_file }}
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] [NetworkDiscovery] Server IP: {{ server_data.ipv4 }}" >> {{ configchecker_log_file }}
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Starting ENHANCED discovery for server {{ server_data.hostname }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] [NetworkDiscovery] Server IP: {{ server_data.ipv4 }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}

- name: "Test basic connectivity to {{ server_data.hostname }}"
  uri:
    url: "https://{{ server_data.ipv4 }}/redfish/v1"
    method: GET
    user: "{{ server_data.username }}"
    password: "{{ server_data.password }}"
    force_basic_auth: yes
    validate_certs: no
    timeout: 10
    headers:
      Accept: "application/json"
    status_code: [200, 401, 404, 500, 503]
  register: connectivity_test
  ignore_errors: true

- name: "Log connectivity test result for {{ server_data.hostname }}"
  shell: |
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] [NetworkDiscovery] Connectivity test for {{ server_data.hostname }}: {{ 'SUCCESS' if connectivity_test.status == 200 else 'FAILED' }}" >> {{ configchecker_log_file }}
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEBUG] [NetworkDiscovery] Connectivity status code: {{ connectivity_test.status | default('N/A') }}" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}

- name: "Get network adapters collection for {{ server_data.hostname }}"
  uri:
    url: "https://{{ server_data.ipv4 }}/redfish/v1/Chassis/1/NetworkAdapters"
    method: GET
    user: "{{ server_data.username }}"
    password: "{{ server_data.password }}"
    force_basic_auth: yes
    validate_certs: no
    timeout: 30
    headers:
      Accept: "application/json"
    status_code: [200, 401, 404, 500, 503]
  register: adapters_result
  ignore_errors: true

- name: "Process each network adapter with detailed information"
  when: adapters_result.status == 200 and adapters_result.json.Members is defined
  block:
    - name: "Log start of detailed processing for {{ server_data.hostname }}"
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Processing {{ adapters_result.json.Members | length }} adapters with detailed information" >> {{ configchecker_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [NetworkDiscovery] Starting detailed adapter information gathering" >> {{ current_discovery_module_log_file | default(discovery_module_log_file) }}

    # Process Adapter 1 - DE041000
    - name: "Get details for Adapter 1 (DE041000)"
      uri:
        url: "https://{{ server_data.ipv4 }}/redfish/v1/Chassis/1/NetworkAdapters/DE041000"
        method: GET
        user: "{{ server_data.username }}"
        password: "{{ server_data.password }}"
        force_basic_auth: yes
        validate_certs: no
        timeout: 30
        headers:
          Accept: "application/json"
        status_code: [200, 401, 404, 500, 503]
      register: adapter1_details
      ignore_errors: true

    - name: "Get Port 1 details for Adapter 1"
      uri:
        url: "https://{{ server_data.ipv4 }}/redfish/v1/Chassis/1/NetworkAdapters/DE041000/Ports/1"
        method: GET
        user: "{{ server_data.username }}"
        password: "{{ server_data.password }}"
        force_basic_auth: yes
        validate_certs: no
        timeout: 30
        headers:
          Accept: "application/json"
        status_code: [200, 401, 404, 500, 503]
      register: adapter1_port1
      ignore_errors: true

    - name: "Add Adapter 1 detailed entry"
      shell: |
        {% if adapter1_details.status == 200 and adapter1_details.json is defined %}
        {% set manufacturer = adapter1_details.json.Manufacturer | default('Unknown') %}
        {% set model = adapter1_details.json.Model | default('Unknown') %}
        {% set part_number = adapter1_details.json.PartNumber | default('Unknown') %}
        {% set serial_number = adapter1_details.json.SerialNumber | default('Unknown') %}
        {% set firmware = adapter1_details.json.Controllers[0].FirmwarePackageVersion | default('Unknown') if adapter1_details.json.Controllers is defined and adapter1_details.json.Controllers | length > 0 else 'Unknown' %}
        {% set port_count = adapter1_details.json.Controllers[0].ControllerCapabilities.NetworkPortCount | default('Unknown') if adapter1_details.json.Controllers is defined and adapter1_details.json.Controllers | length > 0 and adapter1_details.json.Controllers[0].ControllerCapabilities is defined else 'Unknown' %}
        {% set mac_address = adapter1_port1.json.Ethernet.AssociatedMACAddresses[0] | default('Unknown') if adapter1_port1.status == 200 and adapter1_port1.json is defined and adapter1_port1.json.Ethernet is defined and adapter1_port1.json.Ethernet.AssociatedMACAddresses is defined and adapter1_port1.json.Ethernet.AssociatedMACAddresses | length > 0 else 'Unknown' %}
        {% set link_status = adapter1_port1.json.LinkStatus | default('Unknown') if adapter1_port1.status == 200 and adapter1_port1.json is defined else 'Unknown' %}
        
        printf "║ %-12s │ %-15s │ %-12s │ %-20s │ %-12s │ %-18s │ %-12s │ %-18s │ %-12s │ %-6s │ %-17s │ %-13s ║\n" \
          "{{ server_data.hostname[:12] }}" \
          "{{ server_data.ipv4[:15] }}" \
          "{{ server_data.vendor[:12] }}" \
          "{{ (adapter1_details.json.Name | default('Adapter 1'))[:20] }}" \
          "{{ manufacturer[:12] }}" \
          "{{ model[:18] }}" \
          "{{ part_number[:12] }}" \
          "{{ serial_number[:18] }}" \
          "{{ firmware[:12] }}" \
          "{{ port_count | string }}" \
          "{{ mac_address[:17] }}" \
          "{{ link_status[:13] }}" \
          >> {{ current_discovery_table_file | default(discovery_table_file) }}
        
        echo "{{ server_data.hostname }},{{ server_data.ipv4 }},{{ server_data.vendor }},{{ adapter1_details.json.Name | default('Adapter 1') }},{{ manufacturer }},{{ model }},{{ part_number }},{{ serial_number }},{{ firmware }},{{ port_count }},{{ mac_address }},{{ link_status }},DETAILED_SUCCESS" >> {{ current_discovery_csv_file | default(discovery_csv_file) }}
        {% else %}
        printf "║ %-12s │ %-15s │ %-12s │ %-20s │ %-12s │ %-18s │ %-12s │ %-18s │ %-12s │ %-6s │ %-17s │ %-13s ║\n" \
          "{{ server_data.hostname[:12] }}" \
          "{{ server_data.ipv4[:15] }}" \
          "{{ server_data.vendor[:12] }}" \
          "Adapter 1" \
          "DETAIL FAILED" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
          "N/A" \
