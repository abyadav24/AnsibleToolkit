---
- name: UCP Toolkit HA - Simplified Automation System
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    ha_menu_options:
      "1": "ucp_all(Default) - Apply BIOS template and update firmware using SUM Tool"
      "2": "ucp_BIOS_load - Apply BIOS template only"
      "3": "ucp_BIOS_save - Export BIOS settings to file"
      "4": "ucp_power_off - Power off servers"
      "5": "ucp_power_on - Power on servers"
      "6": "Exit"
    log_directory: "{{ playbook_dir }}/../logs"
    current_timestamp: "{{ ansible_date_time.year }}{{ ansible_date_time.month.zfill(2) }}{{ ansible_date_time.day.zfill(2) }}_{{ ansible_date_time.hour.zfill(2) }}{{ ansible_date_time.minute.zfill(2) }}{{ ansible_date_time.second.zfill(2) }}"
    ha_toolkit_log_file: "{{ log_directory }}/ucptoolkit_ha_{{ current_timestamp }}.log"
    
  tasks:
    # Get sudo password at the beginning
    - name: Get sudo password for mount operations
      pause:
        prompt: |
          🔐 Administrator Authentication Required
          
          This script requires sudo privileges for mounting operations.
          Please enter your sudo password
        echo: no
      register: sudo_password

    # Setup logging
    - name: Setup logging directory
      file:
        path: "{{ log_directory }}"
        state: directory
        mode: '0755'

    - name: Initialize execution log
      copy:
        content: |
          UCP TOOLKIT HA EXECUTION LOG - {{ ansible_date_time.iso8601 }}
          ================================================================
          [{{ ansible_date_time.iso8601 }}] Starting UCP Toolkit HA operations
          
        dest: "{{ ha_toolkit_log_file }}"

    # Step 1: Check if AnsibleMediakit is mounted
    - name: Check if AnsibleMediakit is already mounted
      shell: mount | grep "/mnt/AnsibleMediakit" || echo "not_mounted"
      register: mount_check
      changed_when: false

    - name: Log mount check result
      lineinfile:
        path: "{{ ha_toolkit_log_file }}"
        line: "[{{ ansible_date_time.iso8601 }}] AnsibleMediakit mount status: {{ 'MOUNTED' if mount_check.stdout != 'not_mounted' else 'NOT MOUNTED' }}"

    # Step 2: Unmount if mounted, then remount
    - name: Force unmount AnsibleMediakit if already mounted
      become: yes
      become_method: sudo
      vars:
        ansible_become_pass: "{{ sudo_password.user_input }}"
      block:
        - name: Kill processes using AnsibleMediakit
          shell: |
            lsof +D /mnt/AnsibleMediakit 2>/dev/null | awk 'NR>1 {print $2}' | xargs -r kill -9 || true
          ignore_errors: yes
        
        - name: Force unmount
          shell: |
            umount -f /mnt/AnsibleMediakit || umount -l /mnt/AnsibleMediakit || true
          ignore_errors: yes
      when: mount_check.stdout != "not_mounted"

    - name: Log unmount operation
      lineinfile:
        path: "{{ ha_toolkit_log_file }}"
        line: "[{{ ansible_date_time.iso8601 }}] Unmounted existing AnsibleMediakit mount"
      when: mount_check.stdout != "not_mounted"

    - name: Ensure mount point directory exists
      become: yes
      become_method: sudo
      vars:
        ansible_become_pass: "{{ sudo_password.user_input }}"
      file:
        path: /mnt/AnsibleMediakit
        state: directory
        mode: '0755'

    - name: Mount AnsibleMediakit VirtualBox shared folder
      become: yes
      become_method: sudo
      vars:
        ansible_become_pass: "{{ sudo_password.user_input }}"
      mount:
        path: /mnt/AnsibleMediakit
        src: AnsibleMediakit
        fstype: vboxsf
        opts: uid=1000,gid=1000
        state: mounted

    - name: Log successful mount
      lineinfile:
        path: "{{ ha_toolkit_log_file }}"
        line: "[{{ ansible_date_time.iso8601 }}] Successfully mounted AnsibleMediakit at /mnt/AnsibleMediakit"

    # Step 3: Verify folder contents
    - name: Verify required folders exist
      stat:
        path: "{{ item }}"
      register: folder_checks
      loop:
        - /mnt/AnsibleMediakit/HA/BiosTemplates/HAG6
        - "/mnt/AnsibleMediakit/HA/SPV/HA G6"
        - /mnt/AnsibleMediakit/HA/HASPV/HAG6

    - name: Validate required folder structure
      fail:
        msg: "Required folder structure not found in AnsibleMediakit"
      when: folder_checks.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    - name: Log folder validation success
      lineinfile:
        path: "{{ ha_toolkit_log_file }}"
        line: "[{{ ansible_date_time.iso8601 }}] All required folders validated successfully"

    # Step 4: Display menu and get user selection
    - name: Display menu options
      debug:
        msg:
          - ""
          - "Welcome to UCP Toolkit HA!"
          - ""
          - "Please select your option:"
          - "1: ucp_all(Default) - Apply BIOS template and update firmware using SUM Tool"
          - "2: ucp_BIOS_load - Apply BIOS template only"
          - "3: ucp_BIOS_save - Export BIOS settings to file"
          - "4: ucp_power_off - Power off servers"
          - "5: ucp_power_on - Power on servers"
          - "6: Exit"
          - ""

    - name: Get user menu selection
      pause:
        prompt: "Please select your option (1-6)"
      register: user_selection

    - name: Validate user selection
      fail:
        msg: "Invalid option selected. Please enter a number between 1 and 6."
      when: user_selection.user_input not in ha_menu_options.keys()

    - name: Log user selection
      lineinfile:
        path: "{{ ha_toolkit_log_file }}"
        line: "[{{ ansible_date_time.iso8601 }}] User selected option {{ user_selection.user_input }}: {{ ha_menu_options[user_selection.user_input] }}"

    # Step 5: Execute option 1 (ucp_all)
    - name: Execute UCP All - BIOS template and firmware update
      block:
        # Load server configuration
        - name: Load server configuration
          slurp:
            src: "{{ playbook_dir }}/../config/server.csv"
          register: server_csv_content

        - name: Parse server data
          set_fact:
            servers: "{{ (server_csv_content.content | b64decode).split('\n')[1:] | select | map('split', ',') | list }}"

        - name: Get target server details
          set_fact:
            target_server_ip: "{{ servers[0][5] }}"
            target_server_user: "{{ servers[0][6] }}"
            target_server_password: "{{ servers[0][7] }}"
            target_server_model: "{{ servers[0][2] }}"

        - name: Log target server details
          lineinfile:
            path: "{{ ha_toolkit_log_file }}"
            line: "[{{ ansible_date_time.iso8601 }}] Target server: {{ target_server_ip }}, Model: {{ target_server_model }}"

        # Check if server is G6
        - name: Check if server is G6
          set_fact:
            is_g6_server: "{{ 'G6' in target_server_model }}"

        - name: Fail if not G6 server
          fail:
            msg: "Target server is not a G6 model. BIOS template application requires G6 server."
          when: not is_g6_server

        - name: Log G6 server confirmation
          lineinfile:
            path: "{{ ha_toolkit_log_file }}"
            line: "[{{ ansible_date_time.iso8601 }}] Confirmed G6 server, proceeding with BIOS template application"

        # Apply BIOS template using ilorest
        - name: Find BIOS template file
          find:
            paths: ["/mnt/AnsibleMediakit/HA/BiosTemplates/HAG6"]
            patterns: "*.json"
          register: bios_template_files

        - name: Set BIOS template path
          set_fact:
            bios_template_path: "{{ bios_template_files.files[0].path }}"

        - name: Log BIOS template path
          lineinfile:
            path: "{{ ha_toolkit_log_file }}"
            line: "[{{ ansible_date_time.iso8601 }}] Using BIOS template: {{ bios_template_path }}"

        - name: Apply BIOS template using ilorest
          shell: |
            cd {{ playbook_dir }}/../vendor/tools
            ./ilorest_wrapper.sh login {{ target_server_ip }} -u {{ target_server_user }} -p {{ target_server_password }}
            ./ilorest_wrapper.sh load -f "{{ bios_template_path }}"
            ./ilorest_wrapper.sh commit
            ./ilorest_wrapper.sh logout
          register: bios_apply_result

        - name: Log BIOS template application result
          lineinfile:
            path: "{{ ha_toolkit_log_file }}"
            line: "[{{ ansible_date_time.iso8601 }}] BIOS template application {{ 'SUCCESS' if bios_apply_result.rc == 0 else 'FAILED' }}"

        # Mount ISO and update firmware
        - name: Find firmware ISO file
          find:
            paths: ["/mnt/AnsibleMediakit/HA/HASPV/HAG6"]
            patterns: "*.iso"
          register: firmware_iso_files

        - name: Set firmware ISO path
          set_fact:
            firmware_iso_path: "{{ firmware_iso_files.files[0].path }}"

        - name: Log firmware ISO path
          lineinfile:
            path: "{{ ha_toolkit_log_file }}"
            line: "[{{ ansible_date_time.iso8601 }}] Using firmware ISO: {{ firmware_iso_path }}"

        - name: Create ISO mount point
          become: yes
          become_method: sudo
          vars:
            ansible_become_pass: "{{ sudo_password.user_input }}"
          file:
            path: /mnt/spv_iso
            state: directory
            mode: '0755'

        - name: Mount firmware ISO
          become: yes
          become_method: sudo
          vars:
            ansible_become_pass: "{{ sudo_password.user_input }}"
          mount:
            path: /mnt/spv_iso
            src: "{{ firmware_iso_path }}"
            fstype: iso9660
            opts: loop,ro
            state: mounted

        - name: Log ISO mount success
          lineinfile:
            path: "{{ ha_toolkit_log_file }}"
            line: "[{{ ansible_date_time.iso8601 }}] Firmware ISO mounted at /mnt/spv_iso"

        - name: Update firmware using SUM utility
          shell: |
            /mnt/spv_iso/packages/smartupdate --s --romonly --use_location /mnt/spv_iso/packages --target {{ target_server_ip }} --user {{ target_server_user }} --password {{ target_server_password }} --ignore_warnings
          register: firmware_update_result
          async: 1800  # 30 minutes timeout
          poll: 30     # Check every 30 seconds

        - name: Log firmware update result
          lineinfile:
            path: "{{ ha_toolkit_log_file }}"
            line: "[{{ ansible_date_time.iso8601 }}] Firmware update {{ 'SUCCESS' if firmware_update_result.rc == 0 else 'FAILED' }}"

        - name: Unmount firmware ISO
          become: yes
          become_method: sudo
          vars:
            ansible_become_pass: "{{ sudo_password.user_input }}"
          mount:
            path: /mnt/spv_iso
            state: unmounted
          ignore_errors: yes

        - name: Log firmware update completion
          lineinfile:
            path: "{{ ha_toolkit_log_file }}"
            line: "[{{ ansible_date_time.iso8601 }}] Firmware update process completed"

      when: user_selection.user_input == "1"

    # Handle other menu options (placeholder for now)
    - name: Handle other menu options
      debug:
        msg: "Option {{ user_selection.user_input }} selected: {{ ha_menu_options[user_selection.user_input] }}"
      when: user_selection.user_input != "1" and user_selection.user_input != "6"

    # Exit option
    - name: Exit confirmation
      debug:
        msg: "Exiting UCP Toolkit HA. Thank you!"
      when: user_selection.user_input == "6"

    # Final cleanup - Unmount AnsibleMediakit
    - name: Unmount AnsibleMediakit folder
      become: yes
      become_method: sudo
      vars:
        ansible_become_pass: "{{ sudo_password.user_input }}"
      mount:
        path: /mnt/AnsibleMediakit
        state: unmounted
      ignore_errors: yes
      when: user_selection.user_input != "6" or user_selection.user_input == "1"

    - name: Log final cleanup
      lineinfile:
        path: "{{ ha_toolkit_log_file }}"
        line: "[{{ ansible_date_time.iso8601 }}] AnsibleMediakit unmounted, operations completed successfully"

    - name: Display completion message
      debug:
        msg:
          - "✅ UCP Toolkit HA operations completed successfully"
          - "Log file saved at: {{ ha_toolkit_log_file }}"