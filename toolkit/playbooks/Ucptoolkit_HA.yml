---
- name: Ucptoolkit for HA Nodes - Interactive Menu System
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    ha_menu_options:
      "1": "ucp_all(Default) - This applies BIOS template, boot SPV, and boot ESXi installer"
      "2": "ucp_BIOS_load - This applies BIOS template"
      "3": "ucp_BIOS_save - This exports BIOS setting to a file"
      "4": "ucp_firmware - This applies iLo, System ROM, or Server Platform Service firmware"
      "5": "ucp_mount_reboot - This mounts the selected ISO file and boot from it"
      "6": "ucp_power_off"
      "7": "ucp_power_on"
      "8": "ucp_user_creation"
      "9": "Azure_Stack_HCI"
      "10": "Setup_VSSB_Servers"
      "11": "Exit"
    log_directory: "{{ playbook_dir }}/logs"
    current_timestamp: "{{ ansible_date_time.year }}{{ ansible_date_time.month.zfill(2) }}{{ ansible_date_time.day.zfill(2) }}_{{ ansible_date_time.hour.zfill(2) }}{{ ansible_date_time.minute.zfill(2) }}{{ ansible_date_time.second.zfill(2) }}"
    ha_toolkit_log_file: "{{ log_directory }}/ucptoolkit_ha_{{ current_timestamp }}.log"
    ha_module_log_file: "{{ log_directory }}/UcpToolkitHA_AnsibleModule_{{ current_timestamp }}.log"
    
  tasks:
    - name: Display welcome screen
      debug:
        msg: 
          - ""
          - "Welcome to Ucptoolkit for HA Nodes!!!"
          - ""
          - "Please select the appropriate option from the menu below as per your requirement..."
          - ""
          - "1: ucp_all(Default) - This applies BIOS template, boot SPV, and boot ESXi installer"
          - "2: ucp_BIOS_load - This applies BIOS template"
          - "3: ucp_BIOS_save - This exports BIOS setting to a file"
          - "4: ucp_firmware - This applies iLo, System ROM, or Server Platform Service firmware"
          - "5: ucp_mount_reboot - This mounts the selected ISO file and boot from it"
          - "6: ucp_power_off"
          - "7: ucp_power_on"
          - "8: ucp_user_creation"
          - "9: Azure_Stack_HCI"
          - "10: Setup_VSSB_Servers"
          - "11: Exit"
          - ""

    - name: Create logs directory if it doesn't exist
      file:
        path: "{{ log_directory }}"
        state: directory
        mode: '0755'

    - name: Initialize HA toolkit logging
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [UcpToolkitHA] Starting UCP Toolkit HA interactive menu system" >> {{ ha_toolkit_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [UcpToolkitHA] Logging initialized - Main log: {{ ha_toolkit_log_file }}" >> {{ ha_toolkit_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [UcpToolkitHA] Module log: {{ ha_module_log_file }}" >> {{ ha_toolkit_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [MenuSystem] Displaying interactive menu options" >> {{ ha_module_log_file }}

    - name: Prompt user for menu selection
      pause:
        prompt: |
          
          Please select your option now (1-11)
      register: user_selection

    - name: Log user selection
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [MenuSystem] User selected option: {{ user_selection.user_input }}" >> {{ ha_module_log_file }}

    - name: Validate user selection
      fail:
        msg: "Invalid option selected. Please enter a number between 1 and 11."
      when: user_selection.user_input not in ha_menu_options.keys()

    - name: Log validation error
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [ERROR] [MenuSystem] Invalid selection: {{ user_selection.user_input }}" >> {{ ha_module_log_file }}
      when: user_selection.user_input not in ha_menu_options.keys()

    - name: Display selected option
      debug:
        msg: "Perfect! You have selected option {{ user_selection.user_input }}: {{ ha_menu_options[user_selection.user_input] }}"

    - name: Log selected option
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [MenuSystem] Valid selection confirmed: {{ ha_menu_options[user_selection.user_input] }}" >> {{ ha_module_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [UcpToolkitHA] Starting operation: {{ ha_menu_options[user_selection.user_input] }}" >> {{ ha_toolkit_log_file }}

    # Call appropriate module based on selection
    - name: Log UCP All execution start
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [UcpAll] Executing UCP All tasks (option {{ user_selection.user_input }})" >> {{ ha_module_log_file }}
      when: user_selection.user_input in ["1", "9", "10"]

    - name: Execute UCP All (Default)
      include_tasks: tasks/ucp_all_tasks.yml
      when: user_selection.user_input in ["1", "9", "10"]

    - name: Log BIOS Load execution start
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [BiosLoad] Executing BIOS load tasks" >> {{ ha_module_log_file }}
      when: user_selection.user_input == "2"

    - name: Execute BIOS Load
      include_tasks: tasks/ucp_bios_load_tasks.yml
      when: user_selection.user_input == "2"

    - name: Log BIOS Save execution start
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [BiosSave] Executing BIOS save tasks" >> {{ ha_module_log_file }}
      when: user_selection.user_input == "3"

    - name: Execute BIOS Save
      include_tasks: tasks/ucp_bios_save_tasks.yml
      when: user_selection.user_input == "3"

    - name: Log Firmware Update execution start
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [FirmwareUpdate] Executing firmware update tasks" >> {{ ha_module_log_file }}
      when: user_selection.user_input == "4"

    - name: Execute Firmware Update
      include_tasks: tasks/ucp_firmware_tasks.yml
      when: user_selection.user_input == "4"

    - name: Log Mount and Reboot execution start
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [MountReboot] Executing mount and reboot tasks" >> {{ ha_module_log_file }}
      when: user_selection.user_input == "5"

    - name: Execute Mount and Reboot
      include_tasks: tasks/ucp_mount_reboot_tasks.yml
      when: user_selection.user_input == "5"

    - name: Log Power Off execution start
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [PowerOff] Executing power off tasks" >> {{ ha_module_log_file }}
      when: user_selection.user_input == "6"

    - name: Execute Power Off
      include_tasks: tasks/ucp_power_off_tasks.yml
      when: user_selection.user_input == "6"

    - name: Log Power On execution start
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [PowerOn] Executing power on tasks" >> {{ ha_module_log_file }}
      when: user_selection.user_input == "7"

    - name: Execute Power On
      include_tasks: tasks/ucp_power_on_tasks.yml
      when: user_selection.user_input == "7"

    - name: Log User Creation execution start
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [UserCreation] Executing user creation tasks" >> {{ ha_module_log_file }}
      when: user_selection.user_input == "8"

    - name: Execute User Creation
      include_tasks: tasks/ucp_user_creation_tasks.yml
      when: user_selection.user_input == "8"

    - name: Log exit selection
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [MenuSystem] User selected exit option" >> {{ ha_module_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [UcpToolkitHA] Exiting UCP Toolkit HA interactive system" >> {{ ha_toolkit_log_file }}
      when: user_selection.user_input == "11"

    - name: Exit playbook
      debug:
        msg: "Exiting Ucptoolkit HA. Goodbye!"
      when: user_selection.user_input == "11"

    - name: End playbook execution on exit
      meta: end_play
      when: user_selection.user_input == "11"

    - name: Log operation completion
      shell: |
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [UcpToolkitHA] Operation completed: {{ ha_menu_options[user_selection.user_input] }}" >> {{ ha_toolkit_log_file }}
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] [INFO] [MenuSystem] Task execution finished successfully" >> {{ ha_module_log_file }}