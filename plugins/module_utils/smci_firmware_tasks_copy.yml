---
# SMC Firmware Update Tasks
- name: "Log firmware update start"
  shell: |
    echo "=== Processing {{ item['IPv4 Address'] }} ({{ item.Model }}) ===" >> {{ firmware_log_file }}
    echo "Server IP: {{ item['IPv4 Address'] }}" >> {{ firmware_log_file }}
    echo "=== Processing {{ item['IPv4 Address'] }} ({{ item.Model }}) ===" >> {{ saa_module_log_file }}
    echo "Server IP: {{ item['IPv4 Address'] }}" >> {{ saa_module_log_file }}

- name: "Set firmware file paths"
  set_fact:
    model_key: "{{ item.Model.split(' ')[-1] }}"
    bios_file_path: "/mnt/AnsibleMediakit/DS/BIOS/{{ item.Model | replace(' ', '') }}/{{ version_config.servers.supermicro[item.Model.split(' ')[-1]].firmware_files.bios }}"
    bmc_file_path: "/mnt/AnsibleMediakit/DS/BMC/{{ version_config.servers.supermicro[item.Model.split(' ')[-1]].firmware_files.bmc }}"
    temp_extract_path: "{{ settings.temp_path }}/{{ item['IPv4 Address'] | replace('.', '_') }}_{{ item.Model | replace(' ', '_') }}"

- name: "Display firmware file paths being used"
  debug:
    msg: |
      CHECKING FIRMWARE FILES FOR {{ item['IPv4 Address'] }}:
      BIOS: {{ bios_file_path }}
      BMC: {{ bmc_file_path }}

- name: "Create extraction directory"
  file:
    path: "{{ temp_extract_path }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: "Check if firmware files exist"
  stat:
    path: "{{ bios_file_path }}"
  register: bios_file_exists

- name: "Check if BMC firmware file exists"  
  stat:
    path: "{{ bmc_file_path }}"
  register: bmc_file_exists

- name: "Display firmware file availability"
  debug:
    msg: |
      FIRMWARE FILE STATUS FOR {{ item['IPv4 Address'] }}:
      BIOS File: {{ bios_file_exists.stat.exists | ternary('Found', 'Missing') }} - {{ bios_file_path | basename }}
      BMC File: {{ bmc_file_exists.stat.exists | ternary('Found', 'Missing') }} - {{ bmc_file_path | basename }}

- name: "Log firmware file paths"
  shell: |
    echo "BIOS file path: {{ bios_file_path }} (exists: {{ bios_file_exists.stat.exists | default(false) }})" >> {{ firmware_log_file }}
    echo "BMC file path: {{ bmc_file_path }} (exists: {{ bmc_file_exists.stat.exists | default(false) }})" >> {{ firmware_log_file }}

- name: "Set executable permissions on extracted files"
  shell: "find {{ temp_extract_path }} -type f -exec chmod 755 {} \\;"

- name: "Get current BIOS version"
  shell: |
    echo "Getting current BIOS info for {{ item['IPv4 Address'] }}..." >> {{ firmware_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c GetBiosInfo >> {{ saa_module_log_file }} 2>&1
  register: current_bios_info
  ignore_errors: yes

- name: "Get current BMC version"
  shell: |
    echo "Getting current BMC info for {{ item['IPv4 Address'] }}..." >> {{ firmware_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c GetBmcInfo >> {{ saa_module_log_file }} 2>&1
  register: current_bmc_info
  ignore_errors: yes

# Phase 1: Update SMBIOS/FRU Info fields for rebranding
- name: "Display Phase 1 FRU update start"
  debug:
    msg: |
      PHASE 1: STARTING FRU UPDATES FOR {{ item['IPv4 Address'] }}
      Product Name (PN): Hitachi Advanced Server {{ item.Model }}
      Product Manufacturer (PM): Hitachi
      Product Part Model (PPM): Hitachi Advanced Server {{ item.Model }}

- name: "Phase 1: Get current FRU info"
  shell: |
    echo "Phase 1: Getting current FRU info for {{ item['IPv4 Address'] }}..." >> {{ firmware_log_file }}
    echo "Getting current FRU info for {{ item['IPv4 Address'] }}..."
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c getfruinfo 2>&1 | tee -a {{ saa_module_log_file }}
  register: current_fru_info
  ignore_errors: yes

- name: "Phase 1: Update Product Name (PN) in FRU"
  shell: |
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c ChangeFruInfo --item PN --value "Hitachi Advanced Server {{ item.Model }}" >> {{ saa_module_log_file }} 2>&1
  register: fru_pn_result
  ignore_errors: yes

- name: "Phase 1: Update Product Manufacturer (PM) in FRU"
  shell: |
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c ChangeFruInfo --item PM --value "Hitachi" >> {{ saa_module_log_file }} 2>&1
  register: fru_pm_result
  ignore_errors: yes

- name: "Phase 1: Update Product Part Model (PPM) in FRU"
  shell: |
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c ChangeFruInfo --item PPM --value "Hitachi Advanced Server {{ item.Model }}" >> {{ saa_module_log_file }} 2>&1
  register: fru_ppm_result
  ignore_errors: yes

- name: "Phase 1: Verify FRU info updates"
  shell: |
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c getfruinfo >> {{ saa_module_log_file }} 2>&1
  register: verify_fru_info
  ignore_errors: yes

- name: "Display BIOS update status"
  debug:
    msg: "{{ bios_file_exists.stat.exists | ternary('STARTING BIOS UPDATE for ' + item['IPv4 Address'] + ' using ' + (bios_file_path | basename), '⚠️ SKIPPING BIOS UPDATE for ' + item['IPv4 Address'] + ' - file not found') }}"

- name: "Update BIOS"
  shell: |
    echo "Starting BIOS update for {{ item['IPv4 Address'] }}..." >> {{ firmware_log_file }}
    echo "LIVE BIOS UPDATE OUTPUT for {{ item['IPv4 Address'] }}:"
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c UpdateBios --file {{ bios_file_path }} 2>&1 | tee -a {{ saa_module_log_file }}
  register: bios_update_result
  ignore_errors: yes
  when: 
    - bios_file_exists.stat.exists
    - not (firmware_skip_bios | default(false) | bool)

- name: "Skip BIOS update (file missing or disabled)"
  debug:
    msg: "SKIPPING BIOS update for {{ item['IPv4 Address'] }} - {{ 'file not found' if not bios_file_exists.stat.exists else 'disabled in config' }}"
  when: not bios_file_exists.stat.exists or (firmware_skip_bios | default(false) | bool)

- name: "Display BMC update status"
  debug:
    msg: "{{ bmc_file_exists.stat.exists | ternary(' STARTING BMC UPDATE for ' + item['IPv4 Address'] + ' using ' + (bmc_file_path | basename), '⚠️ SKIPPING BMC UPDATE for ' + item['IPv4 Address'] + ' - file not found') }}"
  when: bmc_file_exists.stat.exists and not (firmware_skip_bmc | default(false) | bool)

- name: "Update BMC"
  shell: |
    echo "Starting BMC update for {{ item['IPv4 Address'] }}..." >> {{ firmware_log_file }}
    echo "LIVE BMC UPDATE OUTPUT for {{ item['IPv4 Address'] }}:"
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c UpdateBmc --file {{ bmc_file_path }} 2>&1 | tee -a {{ saa_module_log_file }}
  register: bmc_update_result
  ignore_errors: yes
  when: 
    - bmc_file_exists.stat.exists
    - not (firmware_skip_bmc | default(false) | bool)

- name: "Skip BMC update (disabled in toolkit_config)"
  debug:
    msg: "SKIPPING BMC update for {{ item['IPv4 Address'] }} - disabled in config"
  when: firmware_skip_bmc | default(false) | bool

- name: "Unmount AnsibleMediakit after firmware updates"
  debug:
    msg: "Firmware updates completed for {{ item['IPv4 Address'] }}. Moving to next server if any."

# ==================== NGINX AND ISO ACCESSIBILITY VERIFICATION ====================
- name: "Check if AnsibleMediakit nginx config exists"
  stat:
    path: /etc/nginx/sites-available/AnsibleMediakit
  register: nginx_config_exists
  when: not firmware_skip_pcie_devices

- name: "Create nginx configuration for AnsibleMediakit"
  shell: |
    echo "Creating nginx configuration for AnsibleMediakit..." >> {{ saa_module_log_file }}
    sudo tee /etc/nginx/sites-available/AnsibleMediakit > /dev/null << 'EOF'
    server {
        listen 80;
        server_name _;

        location / {
            autoindex on;
            alias /mnt/AnsibleMediakit/;
        }
    }
    EOF
  when:
    - not skip_pcie
    - not nginx_config_exists.stat.exists
  ignore_errors: yes

- name: "Enable AnsibleMediakit nginx site"
  shell: |
    echo "Enabling AnsibleMediakit nginx site..." >> {{ saa_module_log_file }}
    sudo rm -f /etc/nginx/sites-enabled/default
    sudo ln -sf /etc/nginx/sites-available/AnsibleMediakit /etc/nginx/sites-enabled/AnsibleMediakit
    sudo nginx -t && sudo systemctl reload nginx
  when:
    - not skip_pcie
    - not nginx_config_exists.stat.exists
  ignore_errors: yes

- name: "Verify MiniOS ISO file exists"
  stat:
    path: "/mnt/AnsibleMediakit/DS/{{ toolkit_config.minios_file_name | default('minios20.04_Sep05_2024.iso') }}"
  register: minios_iso_exists
  when: not firmware_skip_pcie_devices

- name: "Get all local IP addresses"
  shell: hostname -I
  register: all_local_ips
  when: not firmware_skip_pcie_devices

- name: "Extract BMC network prefix (first 2 octets)"
  set_fact:
    bmc_network: "{{ item['IPv4 Address'].split('.')[0:2] | join('.') }}"
  when: 
    - not firmware_skip_pcie_devices
    - item['IPv4 Address'] != ''

- name: "Find matching IP from same network as BMC"
  shell: |
    echo "DEBUG: BMC IP = {{ item['IPv4 Address'] }}" >> {{ saa_module_log_file }}
    echo "DEBUG: BMC Network = {{ bmc_network }}" >> {{ saa_module_log_file }}
    echo "DEBUG: All IPs = {{ all_local_ips.stdout }}" >> {{ saa_module_log_file }}
    MATCHED_IP=$(echo "{{ all_local_ips.stdout }}" | tr ' ' '\n' | grep "^{{ bmc_network }}\." | head -1)
    echo "DEBUG: Matched IP = $MATCHED_IP" >> {{ saa_module_log_file }}
    echo "$MATCHED_IP"
  register: matched_ip_result
  ignore_errors: yes
  when: 
    - not firmware_skip_pcie_devices
    - bmc_network is defined

- name: "Select IP (matched or fallback)"
  set_fact:
    selected_ip: "{{ matched_ip_result.stdout if (matched_ip_result.stdout is defined and matched_ip_result.stdout != '') else all_local_ips.stdout.split()[0] }}"
  when: not firmware_skip_pcie_devices

- name: "Display selected IP for ISO serving"
  debug:
    msg: |
      IP Selection for {{ item['IPv4 Address'] }}:
      - BMC IP: {{ item['IPv4 Address'] }}
      - BMC Network: {{ bmc_network | default('N/A') }}
      - Available IPs: {{ all_local_ips.stdout }}
      - Selected IP: {{ selected_ip }}
  when: not firmware_skip_pcie_devices

- name: "Set ISO URL dynamically with correct network IP"
  set_fact:
    iso_url: "http://{{ selected_ip }}/DS/{{ toolkit_config.minios_file_name | default('minios20.04_Sep05_2024.iso') }}"
  when: not firmware_skip_pcie_devices

- name: "Verify ISO accessibility via HTTP"
  shell: |
    echo "Verifying ISO accessibility at {{ iso_url }}..." >> {{ saa_module_log_file }}
    curl -I "{{ iso_url }}" 2>&1 | grep -q "200 OK" && echo "ISO is accessible" || echo "ISO not accessible"
  register: iso_http_check
  ignore_errors: yes
  when: not firmware_skip_pcie_devices

- name: "Display ISO accessibility status"
  debug:
    msg: |
      ISO ACCESSIBILITY CHECK:
      - ISO File: {{ toolkit_config.minios_file_name | default('minios20.04_Sep05_2024.iso') }}
      - File exists: {{ minios_iso_exists.stat.exists | default(false) }}
      - ISO URL: {{ iso_url | default('Not set') }}
      - HTTP Status: {{ 'ACCESSIBLE' if iso_http_check.stdout is defined and 'accessible' in iso_http_check.stdout else 'NOT ACCESSIBLE' }}
  when: not firmware_skip_pcie_devices

- name: "Log ISO setup completion"
  shell: |
    echo "ISO HTTP accessibility verified: {{ iso_url }}" >> {{ firmware_log_file }}
    echo "ISO HTTP accessibility verified: {{ iso_url }}" >> {{ saa_module_log_file }}
  when: 
    - not skip_pcie
    - iso_http_check.stdout is defined
    - "'accessible' in iso_http_check.stdout"

# ==================== VIRTUAL MEDIA OPERATIONS ====================
- name: "Check if virtual media is already mounted"
  shell: |
    echo "Checking virtual media status for {{ item['IPv4 Address'] }}..." >> {{ firmware_log_file }}
    echo "Checking virtual media status for {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c VmManage --action 4 --dev_id 1 >> {{ saa_module_log_file }} 2>&1 || echo "No virtual media to unmount" >> {{ saa_module_log_file }}
  register: vm_status_check
  ignore_errors: yes
  when: not firmware_skip_pcie_devices

- name: "Unmount any existing virtual media"
  shell: |
    echo "Unmounting existing virtual media for {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c VmManage --action 4 --dev_id 1 >> {{ saa_module_log_file }} 2>&1
  register: vm_unmount_result
  ignore_errors: yes
  when: not firmware_skip_pcie_devices

- name: "Mount MiniOS NIC flashing ISO (with retries)"
  shell: |
    echo "Mounting MiniOS NIC flashing ISO for {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    echo "Using ISO URL: {{ iso_url }}" >> {{ saa_module_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c VmManage --action 3 --image_url '{{ iso_url }}' --id tmp --dev_id 1 >> {{ saa_module_log_file }} 2>&1
  register: vm_mount_result
  retries: 3
  delay: 10
  until: vm_mount_result.rc == 0
  ignore_errors: yes
  when: not firmware_skip_pcie_devices

- name: "Set skip flag if ISO mount failed after all retries"
  set_fact:
    skip_remaining_nic_tasks: true
  when:
    - not firmware_skip_pcie_devices
    - vm_mount_result is defined
    - vm_mount_result is failed

- name: "Display ISO mount failure warning"
  debug:
    msg: "⚠️ WARNING: ISO mount failed for {{ item['IPv4 Address'] }} after 3 attempts. Skipping remaining NIC flashing tasks for this server."
  when:
    - not firmware_skip_pcie_devices
    - skip_remaining_nic_tasks | default(false)

- name: "Log ISO mount failure"
  shell: |
    echo "ERROR: ISO mount failed for {{ item['IPv4 Address'] }} after 3 retries. Skipping NIC flashing." >> {{ firmware_log_file }}
    echo "ERROR: ISO mount failed for {{ item['IPv4 Address'] }} after 3 retries. Skipping NIC flashing." >> {{ saa_module_log_file }}
  when:
    - not firmware_skip_pcie_devices
    - skip_remaining_nic_tasks | default(false)

- name: "Wait for ISO mount to complete"
  pause:
    seconds: 10
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Set boot device to CD/DVD and reboot"
  shell: |
    echo "Setting boot device to CD/DVD and rebooting {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c SetBootOption --device_type 13 --action reset --post_complete >> {{ saa_module_log_file }} 2>&1
  register: boot_and_reboot_result
  ignore_errors: yes
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Fallback: Force system reset if boot command failed"
  shell: |
    echo "Boot command failed, performing force reset for {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c SetPowerAction --action Reset >> {{ saa_module_log_file }} 2>&1
  register: force_reboot_result
  ignore_errors: yes
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))
    - boot_and_reboot_result is defined
    - boot_and_reboot_result.rc != 0

- name: "Wait for server to boot from ISO"
  pause:
    seconds: 180
    prompt: "Waiting for {{ item['IPv4 Address'] }} to boot from ISO and complete POST (180 seconds)..."
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Verify MiniOS boot completion via IPMI SOL"
  shell: |
    echo "Verifying MiniOS boot for {{ item['IPv4 Address'] }}..." >> {{ firmware_log_file }}
    echo "Verifying MiniOS boot for {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    python3 {{ playbook_dir }}/../plugins/module_utils/ipmi_sol_helper.py verify_boot {{ item['IPv4 Address'] }} {{ item.Username }} {{ item.Password }} 2>&1 | tee -a {{ saa_module_log_file }}
  register: verify_boot_result
  ignore_errors: yes
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Display boot verification result"
  debug:
    msg: |
      Boot Verification for {{ item['IPv4 Address'] }}:
      {{ verify_boot_result.stdout | default('Boot verification attempted') }}
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "List Ethernet adapters via SOL (JSON output)"
  shell: |
    echo "Listing Ethernet adapters for {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    python3 {{ playbook_dir }}/../plugins/module_utils/ipmi_sol_helper.py list_adapters {{ item['IPv4 Address'] }} {{ item.Username }} {{ item.Password }} Ethernet 2>> {{ saa_module_log_file }}
  register: ethernet_adapters_result
  ignore_errors: yes
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Parse Ethernet adapters JSON"
  set_fact:
    ethernet_list: "{{ ethernet_adapters_result.stdout | default('[]') | from_json }}"
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))
    - ethernet_adapters_result.stdout is defined
    - ethernet_adapters_result.stdout | length > 2
  ignore_errors: yes

- name: "Set empty Ethernet list if parsing failed"
  set_fact:
    ethernet_list: []
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))
    - ethernet_list is not defined

- name: "Display Ethernet cards found"
  debug:
    msg: "Found {{ ethernet_list | length }} Ethernet card(s): {{ ethernet_list | map(attribute='pci_addr') | list }}"
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "List Fibre Channel adapters via SOL (JSON output)"
  shell: |
    echo "Listing Fibre Channel adapters for {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    python3 {{ playbook_dir }}/../plugins/module_utils/ipmi_sol_helper.py list_adapters {{ item['IPv4 Address'] }} {{ item.Username }} {{ item.Password }} Fibre 2>> {{ saa_module_log_file }}
  register: fibre_adapters_result
  ignore_errors: yes
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Parse Fibre Channel adapters JSON"
  set_fact:
    fibre_list: "{{ fibre_adapters_result.stdout | default('[]') | from_json }}"
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))
    - fibre_adapters_result.stdout is defined
    - fibre_adapters_result.stdout | length > 2
  ignore_errors: yes

- name: "Set empty Fibre list if parsing failed"
  set_fact:
    fibre_list: []
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))
    - fibre_list is not defined

- name: "Display Fibre Channel cards found"
  debug:
    msg: "Found {{ fibre_list | length }} Fibre Channel card(s): {{ fibre_list | map(attribute='pci_addr') | list }}"
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Log cards to file"
  shell: |
    echo "Ethernet cards: {{ ethernet_list | map(attribute='pci_addr') | list }}" >> {{ firmware_log_file }}
    echo "Fibre Channel cards: {{ fibre_list | map(attribute='pci_addr') | list }}" >> {{ firmware_log_file }}
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Display cards to be processed for firmware"
  debug:
    msg: |
      
      ==========================================
      Firmware Flashing Summary for {{ item['IPv4 Address'] }}
      ==========================================
      - Ethernet cards detected: {{ ethernet_list | default([]) | length }}
      - Fibre Channel cards detected: {{ fibre_list | default([]) | length }}
      - Mellanox cards to flash: {{ ethernet_list | default([]) | selectattr('vendor', 'search', 'Mellanox|NVIDIA') | list | length }}
      - Emulex cards to flash: {{ fibre_list | default([]) | selectattr('vendor', 'search', 'Emulex') | list | length }}
      ==========================================
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Log firmware flashing summary"
  shell: |
    echo "" >> {{ firmware_log_file }}
    echo "==========================================" >> {{ firmware_log_file }}
    echo "Firmware Flashing Summary for {{ item['IPv4 Address'] }}" >> {{ firmware_log_file }}
    echo "==========================================" >> {{ firmware_log_file }}
    echo "- Ethernet cards detected: {{ ethernet_list | default([]) | length }}" >> {{ firmware_log_file }}
    echo "- Fibre Channel cards detected: {{ fibre_list | default([]) | length }}" >> {{ firmware_log_file }}
    echo "==========================================" >> {{ firmware_log_file }}
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

# Flash Mellanox cards
- name: "Flash Mellanox cards"
  shell: |
    echo "" >> {{ firmware_log_file }}
    echo "==========================================" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    echo "Flashing Mellanox card: {{ adapter_item.pci_addr }}" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    echo "Vendor: {{ adapter_item.vendor }}, Model: {{ adapter_item.model }}" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    echo "Submodel: {{ adapter_item.submodel | default('unknown') }}" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    echo "==========================================" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    
    # Flash Mellanox card via SOL - pass submodel for firmware file selection
    python3 {{ playbook_dir }}/../plugins/module_utils/ipmi_sol_helper.py flash_mellanox {{ item['IPv4 Address'] }} {{ item.Username }} {{ item.Password }} {{ adapter_item.pci_addr }} "{{ adapter_item.submodel | default('') }}" 2>&1 | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    
    echo "Mellanox card {{ adapter_item.pci_addr }} flashing completed" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
  loop: "{{ ethernet_list | default([]) }}"
  loop_control:
    loop_var: adapter_item
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))
    - ethernet_list is defined
    - "'Mellanox' in adapter_item.vendor or 'NVIDIA' in adapter_item.vendor"
  ignore_errors: yes

# Flash Emulex cards
- name: "Flash Emulex Fibre Channel cards"
  shell: |
    echo "" >> {{ firmware_log_file }}
    echo "==========================================" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    echo "Flashing Emulex card: {{ adapter_item.pci_addr }}" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    echo "Vendor: {{ adapter_item.vendor }}, Model: {{ adapter_item.model }}" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    echo "==========================================" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    
    # Flash Emulex card via SOL
    python3 {{ playbook_dir }}/../plugins/module_utils/ipmi_sol_helper.py flash_emulex {{ item['IPv4 Address'] }} {{ item.Username }} {{ item.Password }} {{ adapter_item.pci_addr }} 2>&1 | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
    
    echo "Emulex card {{ adapter_item.pci_addr }} flashing completed" | tee -a {{ firmware_log_file }} {{ saa_module_log_file }}
  loop: "{{ fibre_list | default([]) }}"
  loop_control:
    loop_var: adapter_item
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))
    - fibre_list is defined
    - "'Emulex' in adapter_item.vendor"
  ignore_errors: yes

- name: "Wait for firmware flashing to settle"
  pause:
    seconds: 30
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))


- name: "Unmount ISO after NIC update"
  shell: |
    echo "Unmounting ISO after NIC update for {{ item['IPv4 Address'] }}..." >> {{ saa_module_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c VmManage --action Unmount --dev_id 1 >> {{ saa_module_log_file }} 2>&1
  register: vm_unmount_final
  ignore_errors: yes
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Final reboot to return to normal OS"
  shell: |
    echo "Final reboot of {{ item['IPv4 Address'] }} to return to normal OS..." >> {{ saa_module_log_file }}
    {{ settings.saa_tool_path }} -i {{ item['IPv4 Address'] }} -u {{ item.Username }} -p {{ item.Password }} -c SetPowerAction --action Reset >> {{ saa_module_log_file }} 2>&1
  register: final_reboot_result
  ignore_errors: yes
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Wait for server to return to normal operation"
  pause:
    seconds: 180
    prompt: "Waiting for {{ item['IPv4 Address'] }} to return to normal operation (180 seconds)..."
  when:
    - not firmware_skip_pcie_devices
    - not (skip_remaining_nic_tasks | default(false))

- name: "Cleanup extraction directory"
  file:
    path: "{{ temp_extract_path }}"
    state: absent

# No need to cleanup expect script as we're using Python solution
# - name: "Cleanup temporary expect script"
#   file:
#     path: "/tmp/flash_nic_{{ item['IPv4 Address'] }}.exp"
#     state: absent
#   when:
#     - not firmware_skip_pcie_devices
#     - not (skip_remaining_nic_tasks | default(false))

- name: "Display completion message"
  debug:
    msg: |
      Firmware update completed for {{ item['IPv4 Address'] }}:
      - Phase 1 FRU Update: Completed
      - BMC: {{ 'Skipped' if firmware_skip_bmc | default(false) else 'Updated' }}
      - BIOS: {{ 'Skipped' if not bios_file_exists.stat.exists or (firmware_skip_bios | default(false)) else 'Updated' }}  
      - PCIe/NIC: {{ 'FAILED - ISO mount unsuccessful after 3 retries' if (skip_remaining_nic_tasks | default(false)) else ('Skipped' if firmware_skip_pcie_devices else 'Completed') }}
